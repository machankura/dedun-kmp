# The profile's Ark wallet on regtest: docs/bark-wallet.md, Phase 12.
#
# Second's own stack (bark's contrib/docker/docker-compose.yml at bark-0.8.0), with the images
# pinned rather than `latest`, Core Lightning taken prebuilt rather than built from bark's
# source, an Esplora added -- the Bark SDK reads the chain through one and nothing else -- and
# every port bound to localhost. The service names and the bitcoind credentials (second:ark)
# are Second's, because captaind's built-in configuration expects them.
#
# Separate from ../compose.yml, the group Lightning wallet's network: a different bitcoind, on
# 38443, so the two can run at once.
name: dedun-ark-regtest

services:
  bitcoind:
    # 31.1 rather than Second's 30.0: captaind 0.8.0 refuses anything older than 31.
    image: bitcoin/bitcoin:31.1
    command: [
      "bitcoind",
      "-regtest",
      "-printtoconsole",
      "-rpcbind=0.0.0.0",
      "-rpcallowip=0.0.0.0/0",
      "-fallbackfee=0.00001",
      "-server",
      "-txindex",
      "-blockfilterindex",
      "-coinstatsindex",
      "-rpcauth=second:23f161a911aa7a75e5ac78a8d41d5313$$cae8671bb16c4e6ac6fcf3e98195bf0a5de8ee9ec536471df3f5caf97bc16437",
    ]
    volumes:
      - bitcoind:/home/bitcoin/.bitcoin
    ports:
      - "127.0.0.1:38443:18443"
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=second -rpcpassword=ark -rpcconnect=127.0.0.1 getblockchaininfo || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Ark server's Lightning gateway: Core Lightning with Boltz's hold plugin.
  cln:
    image: docker.io/secondark/cln-hold:v26.06.9
    restart: on-failure
    # The image's start script touches regtest/config before anything has made regtest/ on a
    # fresh volume, and fails; Second's compose builds the image and never meets it.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /root/.lightning/regtest && exec /root/cln/start.sh"]
    volumes:
      - bitcoind:/root/.bitcoin
      - cln:/root/.lightning
    depends_on:
      bitcoind:
        condition: service_healthy

  captaind:
    image: docker.io/secondark/captaind:0.8.0
    environment:
      CAPTAIND_CONFIG: /config/captaind.toml
    volumes:
      - ./captaind.toml:/config/captaind.toml:ro
      - captaind:/data/captaind
      - postgres:/var/lib/postgresql/data
      - cln:/data/cln
    ports:
      - "127.0.0.1:3535:3535"
    depends_on:
      bitcoind:
        condition: service_healthy
      cln:
        condition: service_started

  # The Esplora API on 3002, where ArkWalletRollout.endpointsFor(Regtest) looks.
  esplora:
    image: mempool/electrs:v3.3.0
    command: [
      "--network", "regtest",
      "--daemon-rpc-addr", "bitcoind:18443",
      "--cookie", "second:ark",
      "--jsonrpc-import",
      "--db-dir", "/data",
      "--http-addr", "0.0.0.0:3002",
      "--electrum-rpc-addr", "0.0.0.0:50001",
      "--cors", "*",
    ]
    volumes:
      - esplora:/data
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      bitcoind:
        condition: service_healthy

volumes:
  bitcoind:
  cln:
  captaind:
  postgres:
  esplora:
