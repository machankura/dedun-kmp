[versions]
agp = "9.5.1"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
androidx-testExt = "1.3.0"
androidx-activity = "1.13.0"
androidx-work = "2.11.1"
androidx-lifecycle = "2.11.0"
coilCompose = "3.6.3"
composeHotReload = "1.3.0"
composeMultiplatform = "1.12.2"
# SHA, HMAC, HKDF, AES, ChaCha20, X25519, Ed25519 and RandomInstance
# (vitorpamplona/crypto-kmp). It arrives transitively under quartz, mls-kmp and marmot-kmp, and is
# declared because the app's source names it in 27 places: the two curves the KeyPackage fixtures
# generate keys with, `RandomInstance.bytes` and `sha256`. On Nostr + Blossom from 2.1.1, through
# Magpie (settings.gradle.kts).
#
# This and the three below are `strictly`: gradle otherwise resolves to the highest version anything
# asks for, so a library asking for a newer quartz or crypto would move it silently. Strict, the
# catalog is the resolved graph. docs/quartz-mls-marmot-update.md, D3.
cryptoKmp = { strictly = "2.1.1" }
datastorePreferences = "1.3.0"
kermit = "2.2.0"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinxSerialization = "1.13.0"
ksp = "2.3.14"
ktor = "3.6.1"
# Marmot (MIP-00..05), the three processors, convergence, the publish gate, the app
# components and the KeyPackage managers (vitorpamplona/marmot-kmp). This is quartz's
# former `marmot` package: 2.3.0 dropped the engine and kept only the event classes.
# See docs/marmot-kmp.md. On Nostr + Blossom from 2.3.0, whose source is 2.2.1's.
marmot = { strictly = "2.3.0" }
# The RFC 9420 MLS engine (vitorpamplona/mls-kmp), which is quartz's former `marmot.mls`
# package. The version marmot 2.3.0 was built against, and named here so the catalog says
# which engine reads the group state on every device. 1.4.0 is tagged but not released
# (docs/quartz-mls-marmot-update.md, Phase 0).
mls = { strictly = "1.3.1" }
material3 = "1.12.0-alpha03"
# The version the pinned material3 itself resolves: its material3-adaptive-navigation-suite
# pom asks for adaptive 1.2.0, at 1.10.0-alpha05 and still at 1.12.0-alpha03 and 1.13.0-rc01.
# Picking the newer 1.3.0 would drag window-core 1.5.0 in beside the 1.4.0 the pinned
# material3 compiled against, for a large/extra-large breakpoint pair that 1.2.0 already computes
# through `supportLargeAndXLargeWidth`.
material3Adaptive = "1.2.0"
materialIconsCore = "1.7.3"
materialIconsExtended = "1.7.3"
navigationCompose = "2.10.0"
okio = "3.18.2"
qrose = "1.3.1"
# One patch past the 2.20.0 marmot 2.3.0 was compiled and tested against. A quartz that moved
# an API marmot-kmp calls gives a NoSuchMethodError at run time rather than a compile error, so
# each step past marmot's pin is its own change with its own evidence: 2.20.1 changes only two
# files of quartz's in-process relay server, which neither the app nor marmot-kmp's main source
# uses. docs/quartz-mls-marmot-update.md, D2 and Phase 5a.
quartz = { strictly = "2.20.1" }
room3 = "3.0.3"
sqldelight = "2.3.2"
sqlite = "2.7.1"

[libraries]
# Dedun's Android instrumented tests (composeApp's androidInstrumentedTest) use these two,
# which Bennu deleted as unread (dependency-update, Phase 1).
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastorePreferences" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coilCompose" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
# Versioned with material3 rather than with material3Adaptive: it is published by the
# material3 group, and its version is what names adaptive 1.2.0 in the first place.
compose-material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIconsCore" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinxSerialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
vitorpamplona-crypto = { module = "com.vitorpamplona.crypto:crypto", version.ref = "cryptoKmp" }
vitorpamplona-marmot = { module = "com.vitorpamplona.marmot:marmot", version.ref = "marmot" }
vitorpamplona-mls = { module = "com.vitorpamplona.mls:mls", version.ref = "mls" }
vitorpamplona-quartz = { module = "com.vitorpamplona.quartz:quartz", version.ref = "quartz" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidx-room3 = { id = "androidx.room3", version.ref = "room3" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
